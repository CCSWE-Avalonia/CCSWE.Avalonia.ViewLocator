version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src
      - /.config
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Boise
    cooldown:
      default-days: 3
      exclude:
        - "CCSWE.*"
    ignore:
      # Pinned to the Roslyn host floor (4.8.0); see CLAUDE.md.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
      nuget-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Boise
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
